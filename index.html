<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K4IM | Linktree</title>
    <meta
      name="description"
      content="Linktree oficial do canal K4IM com YouTube, Discord e Instagram."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="page-glow page-glow-one"></div>
      <div class="page-glow page-glow-two"></div>

      <main class="linktree-card">
        <div class="brand-badge">K4IM</div>

        <header class="profile-header">
          <div class="avatar-ring">
            <img
              class="avatar"
              src="https://yt3.googleusercontent.com/kI8rZVLNhhdNRUfJzcR8C_vD4sZcUkcUI9F2cBB2Zzw3nhhjlaJGW0AaowF0gYY40YhoeJV1Xw=s160-c-k-c0x00ffffff-no-rj"
              alt="Foto do canal K4IM"
            />
          </div>

          <p class="eyebrow">YOUTUBE • STREAM • CULTURA</p>
          <h1>K4IM</h1>
          <p class="subtitle">
            Conteúdo intenso, estilo premium e uma comunidade que curte a energia do caos organizado.
          </p>
        </header>

        <nav class="links" id="links" aria-label="Links principais"></nav>

        <section class="request-panel" aria-label="Pedir já">
          <div class="request-header">
            <span class="request-tag">Pedir já</span>
            <h2>Escolha seu pedido</h2>
          </div>

          <div class="request-actions">
            <a class="request-button" href="https://instagram.com/webnex.tech?srtk=eGV6MGg0ajNhNTl2" target="_blank" rel="noreferrer">
              Site/web
            </a>
            <a class="request-button" href="https://discord.gg/5nDX37ghGt" target="_blank" rel="noreferrer">
              Homebrew de RPG
            </a>
          </div>
        </section>

        <div class="stats-row" id="stats"></div>

        <footer class="footer-bar">
          <span>© 2026 K4IM</span>
          <span class="separator">✦</span>
          <span>kanji • gaming • cultura</span>
        </footer>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
